<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <!-- Wave Fill Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="1200" height="240" rx="12" fill="url(#grid)" />

  <!-- Abstract Vector Waves -->
  <path d="M 0 160 Q 300 80 600 150 T 1200 100 L 1200 240 L 0 240 Z" fill="url(#waveGrad)" />
  <path d="M 0 170 Q 350 100 700 180 T 1200 130" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
  <path d="M 0 190 Q 250 140 550 195 T 1200 160" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Animated-like Glowing Circuit Nodes -->
  <circle cx="200" cy="135" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="600" cy="150" r="5" fill="#7928CA" filter="url(#glow)" />
  <circle cx="950" cy="120" r="4" fill="#FF0080" filter="url(#glow)" />

  <!-- Header Text -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">
      GALIB-Dev Engine
    </text>
    
    <!-- Title Underline Accent -->
    <rect x="420" y="122" width="360" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)" />

    <!-- Subtitle -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="20" fill="#8b949e" letter-spacing="1">
      Extreme Parallel Optimization &amp; Scientific Computing
    </text>
  </g>
</svg>
